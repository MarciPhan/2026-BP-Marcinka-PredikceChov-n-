services:
  redis:
    image: redis:alpine
    container_name: discord-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - botnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  discord-bot-primary:
    build: .
    container_name: discord-bot-primary
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - TZ=Europe/Prague
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data:z
    networks:
      - botnet

  web-dashboard:
    build: .
    container_name: web-dashboard
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    command: [ "uvicorn", "web.backend.main:app", "--host", "0.0.0.0", "--port", "${WEB_PORT:-8093}" ]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - BOT_TOKEN=${BOT_TOKEN}
      - TZ=Europe/Prague
      - ENVIRONMENT=production
    ports:
      - "${WEB_PORT:-8093}:${WEB_PORT:-8093}"
    networks:
      - botnet

  discourse-sync:
    build: .
    container_name: discourse-sync
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    command: [ "python", "-m", "scripts.discourse_sync" ]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TZ=Europe/Prague
      - ENVIRONMENT=production
    networks:
      - botnet

networks:
  botnet:
    name: botnet

volumes:
  redis_data:
